spring:
  application:
    name: accelerator-governance

  datasource:
    url: jdbc:postgresql://localhost:5432/aira_platform
    username: aira_admin
    password: aira_local_password_change_me
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: accelerator-governance-pool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      validation-timeout: 5000
      initialization-fail-timeout: -1

server:
  port: 9092

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

aira:
  service:
    name: accelerator-governance
    host-port: 9092
    persistence:
      required: true
      fail-closed: true