spring:
  application:
    name: accelerator-agents
  datasource:
    url: \
    username: \
    password: \
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: accelerator-agents-pool
      maximum-pool-size: \
      minimum-idle: \
      connection-timeout: \
      validation-timeout: \
      initialization-fail-timeout: 1

server:
  port: 9094

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

aira:
  service:
    name: accelerator-agents
    host-port: 9094
    persistence:
      required: true
      fail-closed: true