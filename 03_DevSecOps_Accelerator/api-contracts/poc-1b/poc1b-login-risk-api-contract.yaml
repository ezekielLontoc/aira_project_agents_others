openapi: 3.0.3
info:
  title: AIRA POC-1B Login Risk and Step-Up Governance API
  version: 0.2.0
  description: Phase 2 backend API foundation for POC-1B login risk, step-up authentication, and account lock governance.
paths:
  /health:
    get:
      summary: Runtime health check
      responses:
        "200":
          description: Health response
  /api/v1/identity/risk/readiness:
    get:
      summary: Login risk readiness
      responses:
        "200":
          description: Readiness response
  /api/v1/identity/risk/microfunctions:
    get:
      summary: Login risk microfunction catalog
      responses:
        "200":
          description: MicroFunction catalog
  /api/v1/identity/risk/events:
    get:
      summary: List suspicious login risk events
      responses:
        "200":
          description: Risk event list
    post:
      summary: Create suspicious login risk event
      responses:
        "201":
          description: Risk event created
  /api/v1/identity/risk/events/{eventId}:
    get:
      summary: Get suspicious login risk event
      responses:
        "200":
          description: Risk event detail
  /api/v1/identity/risk/events/{eventId}/review:
    post:
      summary: Review suspicious login risk event
      responses:
        "200":
          description: Review accepted
  /api/v1/identity/risk/login-failures:
    get:
      summary: List login failure triage records
      responses:
        "200":
          description: Login failure triage list
  /api/v1/identity/risk/login-failures/triage:
    post:
      summary: Create login failure triage record
      responses:
        "201":
          description: Triage created
  /api/v1/identity/risk/incidents:
    get:
      summary: List login incident analyses
      responses:
        "200":
          description: Incident list
  /api/v1/identity/risk/incidents/{incidentId}:
    get:
      summary: Get login incident analysis
      responses:
        "200":
          description: Incident detail
  /api/v1/identity/risk/accounts/locked:
    get:
      summary: List locked accounts
      responses:
        "200":
          description: Locked account list
  /api/v1/identity/risk/accounts/{identityId}/lock:
    post:
      summary: Lock account
      responses:
        "201":
          description: Account locked
  /api/v1/identity/risk/accounts/{identityId}/unlock-request:
    post:
      summary: Create account unlock request
      responses:
        "201":
          description: Unlock request created
  /api/v1/identity/risk/unlock-requests/{requestId}/approve:
    post:
      summary: Approve unlock request
      responses:
        "200":
          description: Unlock approved
  /api/v1/identity/risk/unlock-requests/{requestId}/reject:
    post:
      summary: Reject unlock request
      responses:
        "200":
          description: Unlock rejected
  /api/v1/identity/risk/step-up/challenges:
    post:
      summary: Create step-up challenge
      responses:
        "201":
          description: Challenge created
  /api/v1/identity/risk/step-up/challenges/{challengeId}/verify:
    post:
      summary: Verify step-up challenge
      responses:
        "200":
          description: Challenge verified or denied
  /api/v1/identity/risk/policy-decisions:
    get:
      summary: List policy decisions
      responses:
        "200":
          description: Policy decision list