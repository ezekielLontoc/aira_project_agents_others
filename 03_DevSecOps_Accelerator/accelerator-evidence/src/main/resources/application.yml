spring:
  application:
    name: accelerator-evidence
  datasource:
    url: \
    username: \
    password: \
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: accelerator-evidence-pool
      maximum-pool-size: \
      minimum-idle: \
      connection-timeout: \
      validation-timeout: \
      initialization-fail-timeout: 1

server:
  port: 9093

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

aira:
  service:
    name: accelerator-evidence
    host-port: 9093
    persistence:
      required: true
      fail-closed: true